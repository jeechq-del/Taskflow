<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <main class="container p-5">

        <div class="row justify-content-center">
            <div class="col-md-6">
                <h1> Taskflow </h1>
                <form id="formTarea" novalidate>
                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="nombre" placeholder="nombre" required>
                    </div>
                    <div class="mb-3">
                        <label for="descripcion" class="form-label">Descripción</label>
                        <textarea rows="3" class="form-control" id="descripcion" placeholder="descripción"
                            required></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="asignadoA" class="form-label">Asignado a</label>
                        <input type="text" class="form-control" id="asignadoA" placeholder="nombre de una persona"
                            required>
                    </div>
                    <div class="mb-3">
                        <label for="fechaEntrega" class="form-label">Fecha de entrega</label>
                        <input type="date" class="form-control" id="fechaEntrega" required>
                    </div>
                    <div class="mb-3">
                        <label for="estado" class="form-label">Estado</label>
                        <select class="form-select" id="estado" required>
                            <option value="" selected disabled>Selecciona una opción</option>
                            <option value="POR HACER">Por hacer</option>
                            <option value="EN PROCESO">En proceso</option>
                            <option value="REVISIÓN">Revisión</option>
                            <option value="HECHO">Hecho</option>
                        </select>
                    </div>
                    <div class="d-grid gap-2 col-6 mx-auto">
                        <button class="btn btn-primary" type="submit">Guardar tarea</button>

                    </div>  
                    <div id="errores" class="alert alert-danger d-none"></div>
                </form>
                
            </div>
        </div>
        <section id="listaTareas" class="row mt-4 g-3"></section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
