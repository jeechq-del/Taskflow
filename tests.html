<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Pruebas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="p-4">
    <h1>🧪 Pruebas de TaskFlow</h1>
    <p id="resumen" class="fs-5"></p>
    <ul id="resultados" class="list-group mb-4"></ul>

    <!--
      app.js busca estos elementos al cargar (formulario, botón, errores, lista).
      Si no existen, app.js falla. Por eso los ponemos aquí, ocultos.
    -->
    <div class="d-none">
        <form id="formTarea">
            <input id="nombre">
            <textarea id="descripcion"></textarea>
            <input id="asignadoA">
            <input id="fechaEntrega" type="date">
            <select id="estado">
                <option value=""></option>
                <option value="POR HACER">Por hacer</option>
                <option value="HECHO">Hecho</option>
            </select>
            <button id="btnGuardar" type="submit">Guardar tarea</button>
            <div id="errores"></div>
        </form>
        <section id="listaTareas"></section>
    </div>

    <!-- 1. Primero el código de la app, 2. después las pruebas -->
    <script src="js/app.js"></script>
    <script src="js/tests.js"></script>
</body>

</html>
